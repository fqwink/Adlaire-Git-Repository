services:
  adlaire-git-repository:
    build:
      context: .
      dockerfile: Dockerfile
    image: adlaire-git-repository:local
    container_name: adlaire-git-repository
    ports:
      - "8080:8080"
    environment:
      ADLAIRE_HOST: "0.0.0.0"
      ADLAIRE_PORT: "8080"
      ADLAIRE_DATA_DIR: "/data"
      DB_DRIVER: "sqlite"
    volumes:
      - adlaire-data:/data
    restart: unless-stopped

volumes:
  adlaire-data:
